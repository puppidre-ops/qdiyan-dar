const wa=(t)=>{const n=cfg.WHATSAPP_NUMBER;return `https://wa.me/${n}${t?"?text="+encodeURIComponent(t):""}`};

function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
// ====== حالة الخدمة ======
function status(){
  if(cfg.paused)return{k:"no",t:"الطلبات متوقفة مؤقتًا. يمكنك تجهيز السلة وإرسال استفسار."};
  const d=new Date();const m=d.getHours()*60+d.getMinutes();
  const [a,b]=[cfg.open,cfg.close].map(x=>{const[h,mi]=x.split(":");return +h*60+ +mi});
  if(m<a||m>b)return{k:"no",t:`خارج ساعات العمل. نستقبلو من ${cfg.open} حتى ${cfg.close}. تقدر تجهّز سلتك وتبعث استفسار.`};
  return{k:"ok",t:`الخدمة مفتوحة الآن · حتى ${cfg.close}`};
}
const isFri=()=>new Date().getDay()===5;
function avTag(p){
  if(p.a==="n"||(p.c==="bread"&&cfg.breadOut&&p.id<=26&&p.u==="p"))return'<span class="tag no">غير متوفر</span>';
  if(p.a==="y")return'<span class="tag">متوفر</span>';
  return'<span class="tag ch">يُؤكَّد التوفر</span>';
}
const blocked=p=>p.a==="n"||(p.c==="bread"&&cfg.breadOut&&p.u==="p");
const price=p=>p.p>0?`<span class="pr">${num(p.p)} دج / ${U[p.u]}</span>`:'<span class="sm">السعر يُؤكَّد عند الطلب</span>';
function card(p){
  return `<div class="card"><a href="#/p/${p.id}">${img(p)}</a><div class="in"><h3>${esc(p.n)}</h3><div>${avTag(p)}</div>
  <div class="pf">${price(p)}<button class="plus" aria-label="أضف إلى السلة" ${blocked(p)?"disabled":""} onclick="add(${p.id})">+</button></div></div></div>`;
}

function add(id,qq){const p=prods.find(x=>x.id===id);const it=cart.find(x=>x.id===id);const s=qq||step(p);if(it)it.q+=s;else cart.push({id,q:s,note:""});save();upd();toast("تمت الإضافة إلى السلة")}
function chg(id,d){const it=cart.find(x=>x.id===id);const p=prods.find(x=>x.id===id);it.q=Math.max(0,+(it.q+d*step(p)).toFixed(2));if(!it.q)cart=cart.filter(x=>x.id!==id);save();upd();route()}
const reqBox=()=>`<div class="box" style="border-style:dashed"><b>ما لقيتش واش تحتاج؟</b><div class="sm">اكتب المنتج اللي ما هوش في القائمة ونحاولو نلقاوهولك في المحلات. التوفر والسعر يتأكدو معاك قبل الشراء.</div><label>اسم المنتج</label><input id="r_n" maxlength="80"><label>الكمية أو الحجم (مثال: 2 كغ، علبتين)</label><input id="r_q" maxlength="40"><label>ملاحظة (الماركة، النوع…)</label><input id="r_o" maxlength="120"><button class="btn o" style="margin-top:10px;width:100%" onclick="addCust()">أضف طلبي الخاص للسلة</button></div>`;
const custList=()=>cust.map((c,i)=>`<div class="ci"><div style="flex:1"><b>${esc(c.n)}</b> <span class="tag ch">طلب خاص</span><div class="sm">${esc(c.q)}${c.note?" · "+esc(c.note):""}</div><div class="sm">السعر والتوفر يُؤكَّدان بعد البحث</div></div><button class="btn s l" onclick="rmCust(${i})">حذف</button></div>`).join("");
function addCust(){const n=$("#r_n").value.trim();if(!n)return toast("اكتب اسم المنتج");cust.push({n,q:$("#r_q").value.trim()||"1",note:$("#r_o").value.trim()});save();upd();toast("أضفنا طلبك الخاص للسلة");if(location.hash.startsWith("#/cart"))route();else{$("#r_n").value="";$("#r_q").value="";$("#r_o").value=""}}
function rmCust(i){cust.splice(i,1);save();upd();route()}
let lt=[];function logoTap(){const n=Date.now();lt=lt.filter(t=>n-t<5000);lt.push(n);if(lt.length>=5){lt=[];location.hash="#/admin"}}
function rm(id){cart=cart.filter(x=>x.id!==id);save();upd();route();toast("تم حذف المنتج من السلة")}
function clearCart(){cart=[];cust=[];save();upd();route();toast("تم إفراغ السلة")}
function setNote(id,v){cart.find(x=>x.id===id).note=v;save()}
const items=()=>cart.map(c=>({...c,p:prods.find(x=>x.id===c.id)})).filter(c=>c.p);
const sub=()=>items().reduce((s,c)=>s+c.p.p*c.q,0);
const subTxt=()=>sub()===0&&unknown()?"يُحدَّد عند التأكيد":num(sub())+" دج";
const totTxt=()=>sub()===0&&unknown()?num(cfg.fee)+" دج + ثمن المنتجات":num(sub()+cfg.fee)+" دج";

const hasWeighed=()=>items().some(c=>c.p.u==="k");

function pp(id,k,v){const p=prods.find(p=>p.id===id);if(v==="")delete p[k];else p[k]=v;save()}
function upImg(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,480/im.width);const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const old=prods.find(p=>p.id===id).img;prods.find(p=>p.id===id).img=c.toDataURL("image/jpeg",.75);try{localStorage.setItem("qd_prod",JSON.stringify(prods))}catch(e){prods.find(p=>p.id===id).img=old;toast("الذاكرة ممتلئة، جرّب صورة أصغر");return}route();toast("تم تحديث الصورة")};im.onerror=()=>toast("ملف الصورة غير صالح");im.src=r.result};r.readAsDataURL(f)}
function dp(id){prods=prods.filter(p=>p.id!==id);cart=cart.filter(c=>c.id!==id);save();upd();route()}
function np(){const n=$("#n_n").value.trim();if(!n)return toast("اكتب اسم المنتج");prods.push({id:Math.max(0,...prods.map(p=>p.id))+1,c:$("#n_c").value,n,p:Math.max(0,+$("#n_p").value||0),u:$("#n_u").value,h:0,a:"c"});save();route();toast("تمت الإضافة")}
// ====== التوجيه ======
function footer(){
  const links=[cfg.phone&&`<a href="tel:${esc(cfg.phone)}">${esc(cfg.phone)}</a>`,`<a target="_blank" rel="noopener" href="${wa("")}">واتساب</a>`,cfg.facebook&&/^https?:\/\//.test(cfg.facebook)&&`<a target="_blank" rel="noopener" href="${esc(cfg.facebook)}">فيسبوك</a>`].filter(Boolean).join("");
  $("#ft").innerHTML=`<b>${esc(cfg.name)}</b> · قصر الحيران، ولاية الأغواط، الجزائر<br>${links}<br><br><a href="#/info">معلومات الخدمة</a><a href="#/privacy">سياسة الخصوصية</a><a href="#/info">شروط الخدمة</a><br><br><button class="btn s l" onclick="shareSite()">مشاركة الموقع</button>`;
}
function shareSite(){const u=cfg.siteUrl||location.href.split("#")[0];if(!/^https?:/.test(u)){toast("الرابط العام للموقع غير جاهز بعد");return}if(navigator.share)navigator.share({title:cfg.name,url:u}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(cfg.name+" "+u),"_blank")}
const NAV=[["","الرئيسية"],["products","المنتجات"],["cart","السلة"],["info","معلومات"]];
function route(){
  const h=(location.hash||"#/").slice(2);const[path,qs]=h.split("?");const seg=path.split("/");
  if(qs){const m=qs.match(/c=(\w+)/);if(m){fcat=m[1];}}
  let html;
  switch(seg[0]){case"":html=home();break;case"products":html=list()+reqBox();break;case"p":html=detail(seg[1]);break;case"cart":html=cartPage();break;case"checkout":html=checkout();break;case"info":html=info();break;case"privacy":html=privacy();break;case"admin":html=admin();break;default:html=home()}
  $("#app").innerHTML=html;
  $("#nav").innerHTML=NAV.map(n=>`<a href="#/${n[0]}" class="${seg[0]===n[0]?"on":""}">${n[1]}</a>`).join("");
  document.title=cfg.name+" | توصيل مستلزمات البيت في قصر الحيران";footer();upd();
}
addEventListener("hashchange",()=>{window.scrollTo(0,0);route()});
route();
</script>
